action_type: differential_drive
sensor_needs: [laserscan]
obs_policy: lossless
controls_orientation: false

depends:
  global_plan: true

observations:
  aliases:
    goal_pose: subgoal_from_plan
    robot_pose: robot_pose_from_tf

  datasources:
    robot_pose_from_tf:
      type: RobotPoseTFGenerator
      params: {}

    laser_scan:
      type: sensor_msgs/LaserScan
      params:
        sensor: laserscan
        canonical_beams: 720

    pedestrians:
      type: arena_people_msgs/Pedestrians
      params:
        topic: arena_peds

    goal_pose:
      type: geometry_msgs/PoseStamped
      params:
        topic: goal_pose

    global_plan:
      type: nav_msgs/Path
      params:
        topic: plan

    costmap:
      type: nav_msgs/OccupancyGrid
      params:
        topic: global_costmap/costmap

    subgoal_from_plan:
      type: SubgoalGenerator
      params:
        lookahead: 2.0
