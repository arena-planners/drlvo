[project]
name = "arena_planners_drlvo"
version = "0.0.0"
description = "DRL-VO planner adapter for arena_planners bridge."
requires-python = ">=3.10,<3.11"
dependencies = [
    "arena_planners",
    "torch==1.11.0",
    "stable-baselines3==1.1.0",
    "gym==0.23.1",
    "numpy<2",
    "pyyaml",
]

[tool.uv.sources]
arena_planners = { git = "https://github.com/arena-planners/arena_planners.git", branch = "jazzy", subdirectory = "arena_planners" }

[tool.setuptools]
packages = []
py-modules = []

[tool.ruff.lint.isort]
known-first-party = ["policy"]
